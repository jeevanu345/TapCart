services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tapcart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tapcart
    volumes:
      - tapcart-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapcart"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tapcart:${POSTGRES_PASSWORD}@db:5432/tapcart
    depends_on:
      db:
        condition: service_healthy
volumes:
  tapcart-db:
